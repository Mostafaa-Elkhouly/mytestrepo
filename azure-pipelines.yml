# --------------------------------------------------------------------------------
# Azure DevOps Pipeline: Provision Azure Virtual Machine
# Triggered dynamically by Backstage Scaffolder
# --------------------------------------------------------------------------------

trigger: none

parameters:
  - name: vmName
    type: string
    default: "dev-vm-01"
  - name: location
    type: string
    default: "eastus"
  - name: vmSize
    type: string
    default: "Standard_B2s"
  - name: osImage
    type: string
    default: "ubuntu-2204"
  - name: adminUsername
    type: string
    default: "azureadmin"

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "Visual Studio Enterprise Subscription(15ec917d-2164-4d61-9fb2-243e7e5dad56)"
  resourceGroupName: "rg-backstage-vms-${{ parameters.location }}"
  vnetName: "vnet-backstage-${{ parameters.location }}"
  subnetName: "snet-default"

stages:
- stage: ProvisionVM
  displayName: Provision Virtual Machine Infrastructure
  jobs:
  - job: DeployVM
    displayName: Deploy Azure VM
    steps:

    # --------------------------------------------------------------------------
    # Step 1: Pre-flight Validations & Target Environment Setup
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: "Pre-flight: Prepare Network & Resource Group"
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          echo "Ensuring Resource Group exists..."
          az group create --name "$(resourceGroupName)" --location "${{ parameters.location }}" -o table

          echo "Ensuring baseline VNet and Subnet exist to prevent implicit creation conflicts..."
          az network vnet create \
            --resource-group "$(resourceGroupName)" \
            --name "$(vnetName)" \
            --address-prefix 10.0.0.0/16 \
            --subnet-name "$(subnetName)" \
            --subnet-prefix 10.0.1.0/24 \
            -o table

    # --------------------------------------------------------------------------
    # Step 2: Dynamic OS & Credential Mapping
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: "Pre-flight: Map Image URN & Credentials"
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          # Map parameters to official Azure URNs
          case "${{ parameters.osImage }}" in
            ubuntu-2204)
              URN="Canonical:0001-com-ubuntu-server-jammy:22_04-lts:latest"
              OS_TYPE="Linux"
              ;;
            ubuntu-2004)
              URN="Canonical:0001-com-ubuntu-server-focal:20_04-lts:latest"
              OS_TYPE="Linux"
              ;;
            windows-2022)
              URN="MicrosoftWindowsServer:WindowsServer:2022-Datacenter:latest"
              OS_TYPE="Windows"
              ;;
            windows-2019)
              URN="MicrosoftWindowsServer:WindowsServer:2019-Datacenter:latest"
              OS_TYPE="Windows"
              ;;
            *)
              echo "##vso[task.logissue type=error]Unsupported OS Image parameter passed from Backstage: ${{ parameters.osImage }}"
              exit 1
              ;;
          esac

          echo "##vso[task.setvariable variable=targetImageUrn]$URN"
          echo "##vso[task.setvariable variable=osType]$OS_TYPE"
          
          # Generate a secure random password for Windows deployments
          if [ "$OS_TYPE" = "Windows" ]; then
            SFX=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9')
            WIN_PASS="P@ss!${SFX:0:12}"
            echo "##vso[task.setvariable variable=winAdminPassword;issentinel=true;issecret=true]$WIN_PASS"
            echo "Windows password securely generated for provisioning."
          fi

    # --------------------------------------------------------------------------
    # Step 3: Core Infrastructure Provisioning (Asynchronous + Polling)
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: "Execute: Provision Azure VM"
      name: ProvisionStep
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          AUTH_FLAGS="--generate-ssh-keys"
          if [ "$(osType)" = "Windows" ]; then
            AUTH_FLAGS="--admin-password $(winAdminPassword)"
          fi

          echo "Launching asynchronous deployment for ${{ parameters.vmName }} using VM Size ${{ parameters.vmSize }}..."
          
          # 1. Use --no-wait to bypass the buggy ARM exception handler in arm.py
          az vm create \
            --resource-group "$(resourceGroupName)" \
            --name "${{ parameters.vmName }}" \
            --image "$(targetImageUrn)" \
            --size "${{ parameters.vmSize }}" \
            --admin-username "${{ parameters.adminUsername }}" \
            --vnet-name "$(vnetName)" \
            --subnet "$(subnetName)" \
            --public-ip-sku Standard \
            $AUTH_FLAGS \
            --no-wait

          echo "Deployment initiated. Polling compute resource until provisioning completes..."
          
          # 2. Poll the Compute API directly. This avoids ARM template crashes and waits cleanly.
          az vm wait \
            --resource-group "$(resourceGroupName)" \
            --name "${{ parameters.vmName }}" \
            --created \
            --timeout 600

          echo "VM successfully provisioned! Fetching network properties..."

          # 3. Extract IP addresses cleanly using native CLI queries
          PUBLIC_IP=$(az vm show -d -g "$(resourceGroupName)" -n "${{ parameters.vmName }}" --query "publicIps" -o tsv)
          PRIVATE_IP=$(az vm show -d -g "$(resourceGroupName)" -n "${{ parameters.vmName }}" --query "privateIps" -o tsv)
          
          echo "##vso[task.setvariable variable=vmPublicIp]$PUBLIC_IP"
          echo "##vso[task.setvariable variable=vmPrivateIp]$PRIVATE_IP"

    # --------------------------------------------------------------------------
    # Step 4: Fallback Diagnostic Extraction (Executes only on failure)
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: "Diagnostics: Analyze Deployment Errors"
      condition: failed()
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "================================================================="
          echo "           FETCHING COMPONENT LEVEL DEPLOYMENT ERRORS            "
          echo "================================================================="
          
          echo "1. Checking top-level ARM deployment failures in $(resourceGroupName)..."
          az deployment group list \
            --resource-group "$(resourceGroupName)" \
            --query "[?properties.provisioningState=='Failed'].{Name:name, Code:properties.error.code, Message:properties.error.message}" \
            --output table || true

          echo ""
          echo "2. Checking detailed deployment operation failures..."
          LAST_DEPLOYMENT=$(az deployment group list --resource-group "$(resourceGroupName)" --query "[?properties.provisioningState=='Failed'].name | [0]" -o tsv || true)
          
          if [ ! -z "$LAST_DEPLOYMENT" ]; then
            echo "Inspecting failed operations for deployment: $LAST_DEPLOYMENT"
            az deployment operation group list \
              --resource-group "$(resourceGroupName)" \
              --name "$LAST_DEPLOYMENT" \
              --query "[?properties.provisioningState=='Failed'].{Resource:properties.targetResource.resourceName, Type:properties.targetResource.resourceType, Code:properties.statusMessage.error.code, Message:properties.statusMessage.error.message}" \
              -o table || true
          else
            echo "No broken deployment templates found. Checking Azure Activity Log..."
            az monitor activity-log list --resource-group "$(resourceGroupName)" --max-events 10 --status Failed --query "[].{Operation:operationName.localizedValue, Status:status.value, Message:properties.statusMessage}" -o table || true
          fi
          
    # --------------------------------------------------------------------------
    # Step 5: Format Final Outputs for Backstage Consumption
    # --------------------------------------------------------------------------
    - script: |
        echo "================================================================="
        echo "           VM PROVISIONING COMPLETED SUCCESSFULLY                "
        echo "================================================================="
        echo "VM Name    : ${{ parameters.vmName }}"
        echo "OS Platform: $(osType) (${{ parameters.osImage }})"
        echo "Region     : ${{ parameters.location }}"
        echo "Size Spec  : ${{ parameters.vmSize }}"
        echo "Public IP  : $(vmPublicIp)"
        echo "Private IP : $(vmPrivateIp)"
        echo "================================================================="
        echo "Backstage data registration format: ready."
      displayName: "Summary: Emit Infrastructure Metadata"
      condition: succeeded()