# --------------------------------------------------------------------------------
# Azure DevOps Pipeline: Provision Azure Virtual Machine
# Triggered dynamically by Backstage Scaffolder
# --------------------------------------------------------------------------------

trigger: none

parameters:
  - name: vmName
    type: string
    default: "dev-vm-01"

  - name: location
    type: string
    default: "westeurope"

  - name: vmSize
    type: string
    default: "Standard_B2s"

  - name: osImage
    type: string
    default: "ubuntu-2204"

  - name: adminUsername
    type: string
    default: "azureadmin"

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "Visual Studio Enterprise Subscription(15ec917d-2164-4d61-9fb2-243e7e5dad56)"
  resourceGroupName: "rg-backstage-vms-${{ parameters.location }}"

stages:

- stage: ProvisionVM
  displayName: Provision Virtual Machine Infrastructure

  jobs:

  - job: DeployVM
    displayName: Deploy Azure VM

    steps:

    # --------------------------------------------------------------------------
    # Create Resource Group
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: Create Resource Group
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -euo pipefail

          if az group exists --name "$(resourceGroupName)"; then
            echo "Resource Group already exists."
          else
            echo "Creating Resource Group..."
            az group create \
              --name "$(resourceGroupName)" \
              --location "${{ parameters.location }}"
          fi

    # --------------------------------------------------------------------------
    # Provision VM
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: Provision Azure VM
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set +e

          case "${{ parameters.osImage }}" in
            ubuntu-2204)
              AZ_IMAGE="Canonical:0001-com-ubuntu-server-jammy:22_04-lts:latest"
              ;;
            ubuntu-2004)
              AZ_IMAGE="Canonical:0001-com-ubuntu-server-focal:20_04-lts:latest"
              ;;
            windows-2022)
              AZ_IMAGE="MicrosoftWindowsServer:WindowsServer:2022-Datacenter:latest"
              ;;
            windows-2019)
              AZ_IMAGE="MicrosoftWindowsServer:WindowsServer:2019-Datacenter:latest"
              ;;
            *)
              echo "Unsupported image."
              exit 1
              ;;
          esac

          echo "========================================"
          echo "Azure Account"
          echo "========================================"

          az account show -o table

          echo ""
          echo "========================================"
          echo "Resource Group"
          echo "========================================"

          az group show \
            --name "$(resourceGroupName)" \
            -o table

          echo ""
          echo "========================================"
          echo "VM Size Availability"
          echo "========================================"

          az vm list-skus \
            --location "${{ parameters.location }}" \
            --resource-type virtualMachines \
            --query "[?name=='${{ parameters.vmSize }}'].name" \
            -o table

          echo ""
          echo "========================================"
          echo "Image Validation"
          echo "========================================"

          az vm image show \
            --urn "$AZ_IMAGE" \
            -o table

          echo ""
          echo "========================================"
          echo "Creating VM..."
          echo "========================================"

          az vm create \
            --resource-group "$(resourceGroupName)" \
            --name "${{ parameters.vmName }}" \
            --image "$AZ_IMAGE" \
            --size "${{ parameters.vmSize }}" \
            --admin-username "${{ parameters.adminUsername }}" \
            --generate-ssh-keys \
            --public-ip-sku Standard \
            --output json \
            --debug

          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "VM creation failed"
            echo "========================================"

            echo ""
            echo "Deployments"

            az deployment group list \
              --resource-group "$(resourceGroupName)" \
              -o table || true

            DEPLOYMENT=$(az deployment group list \
              --resource-group "$(resourceGroupName)" \
              --query "[0].name" \
              -o tsv 2>/dev/null)

            if [ ! -z "$DEPLOYMENT" ]; then

              echo ""
              echo "Deployment Details"

              az deployment group show \
                --resource-group "$(resourceGroupName)" \
                --name "$DEPLOYMENT" \
                -o json || true

              echo ""
              echo "Deployment Operations"

              az deployment operation group list \
                --resource-group "$(resourceGroupName)" \
                --name "$DEPLOYMENT" \
                -o table || true
            fi

            exit $EXIT_CODE
          fi

          echo ""
          echo "VM created successfully."

    # --------------------------------------------------------------------------
    # Show VM
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: Show VM Details
      condition: succeeded()
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          az vm show \
            --resource-group "$(resourceGroupName)" \
            --name "${{ parameters.vmName }}" \
            --show-details \
            -o table

    # --------------------------------------------------------------------------
    # Activity Log
    # --------------------------------------------------------------------------
    - task: AzureCLI@2
      displayName: Show Activity Log
      condition: failed()
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "========================================"
          echo "Recent Activity Log"
          echo "========================================"

          az monitor activity-log list \
            --resource-group "$(resourceGroupName)" \
            --max-events 20 \
            -o table || true

    # --------------------------------------------------------------------------
    # Summary
    # --------------------------------------------------------------------------
    - script: |
        echo "========================================"
        echo "VM Provisioning Completed Successfully"
        echo "VM Name : ${{ parameters.vmName }}"
        echo "Region  : ${{ parameters.location }}"
        echo "VM Size : ${{ parameters.vmSize }}"
        echo "Image   : ${{ parameters.osImage }}"
        echo "========================================"
      displayName: Deployment Summary